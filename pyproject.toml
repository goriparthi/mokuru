[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mokuru"
version = "0.1.0"
description = "Lights and LCD for the MOKURU AK8753 keyboard, with Claude Code integration"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Prashanth Goriparthi" }]
dependencies = ["hidapi>=0.14", "pillow>=10"]

[project.optional-dependencies]
tray = ["pystray>=0.19"]
dev = ["pytest>=8"]

[project.scripts]
mokuru = "mokuru.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
